[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flexreportfinance"
version = "0.3.1"
description = "Python client for the Flexreport Finance REST API: stream real-time stock updates and download research reports as PDFs, in the default layout or your own branded template."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Curt Beck", email = "curt@flexreportfinapi.com" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "tqdm>=4.70",
]

[project.urls]
Repository = "https://github.com/cbecks1212/flexreport-python-client"
Documentation = "https://app.flexreportfinapi.com/python-client"
